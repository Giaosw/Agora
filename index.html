<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boda 💍 - Sube tus Fotos</title>
  <link rel="stylesheet" href="pau.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>💖 Nuestra Boda 💖</h1>
      <p>Sube tus fotos y videos para compartir los recuerdos más hermosos ✨</p>

      <!-- Input oculto -->
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>

      <!-- Icono solo para seleccionar archivos -->
      <div id="selectIcon" title="Seleccionar archivos">
        <i class="fas fa-folder-open"></i> Elegir archivos
      </div>

      <!-- Mensaje de archivos seleccionados -->
      <div id="fileCount" class="file-count"></div>

      <!-- Botón de subir archivos -->
      <div class="button-container">
        <button id="uploadBtn">Subir archivos</button>
      </div>

      <!-- Loader moderno -->
      <div id="loader">
        <div class="heart"></div>
        <p>Cargando...</p>
      </div>

      <pre id="response"></pre>
    </div>
  </div>

  <script src="pau.js"></script>
</body>
</html>
