<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora - Editor 3D</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .container-fluid {
            height: 100%;
            padding: 0;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            border: 1px solid #ddd;
        }

        .sidebar {
            background-color: #343a40;
            color: white;
            padding: 20px;
            position: fixed;
            top: 60px;
            right: 0;
            height: calc(100vh - 60px);
            width: 300px;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-left {
            width: 10%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-right {
            width: 90%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .menu-item {
            cursor: pointer;
            padding: 10px;
            background-color: #495057;
            margin-bottom: 5px;
            border-radius: 5px;
        }

        .menu-item:hover {
            background-color: #6c757d;
        }

        .button-box {
            width: 100%;
            height: 25%;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .button-box button {
            width: 22%;
            background-color: #495057;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .button-box button:hover {
            background-color: #6c757d;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .layer-control {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .layer-control button {
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">Agora</a>
    </nav>

    <!-- Contenedor principal -->
    <div class="container-fluid d-flex">
        <!-- Columna del medio: Canvas 3D -->
        <div style="position: relative; width: 100%; height: 100vh;">
            <canvas id="renderCanvas"></canvas>
        </div>

        <!-- Columna de la derecha: Menú -->
        <div class="sidebar">
            <div class="sidebar-left">
                <div class="button-box">
                    <button>1</button>
                    <button>2</button>
                </div>
                <div class="button-box">
                    <button>3</button>
                    <button>4</button>
                </div>
            </div>

            <div class="sidebar-right">
                <div class="sidebar-header">Opciones</div>
                <div id="objectMenu">
                    <div class="menu-item" id="addBox">Añadir Cubo</div>
                    <div class="menu-item" id="addSphere">Añadir Esfera</div>
                    <div class="menu-item" id="addCylinder">Añadir Cilindro</div>
                </div>

                <hr>

                <div class="sidebar-header">Capas</div>
                <div id="layerControls">
                    <!-- Lista de objetos dinámicos -->
                </div>

                <hr>

                <div class="sidebar-header">Materiales</div>
                <div>
                    <input type="color" id="colorPicker" class="form-control" value="#ffffff">
                    <button class="btn btn-primary btn-block" id="applyMaterial">Aplicar</button>
                </div>

                <hr>

                <div class="sidebar-header">Exportar</div>
                <button class="btn btn-success btn-block" id="exportModel">Exportar a OBJ</button>

                <hr>

                <div class="sidebar-header">Generación IA</div>
                <div class="input-group">
                    <input type="text" id="aiPrompt" class="form-control" placeholder="Describe tu diseño...">
                    <div class="input-group-append">
                        <button class="btn btn-secondary">Generar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 Agora - Todos los derechos reservados</p>
    </div>

    <!-- Bootstrap JS, jQuery y Popper.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        var canvas = document.getElementById("renderCanvas");
        var engine = new BABYLON.Engine(canvas, true);
        var scene = new BABYLON.Scene(engine);
        var camera = new BABYLON.ArcRotateCamera("camera1", Math.PI / 2, Math.PI / 2, 10, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        var light = new BABYLON.HemisphericLight("light1", BABYLON.Vector3.Up(), scene);

        var grid = BABYLON.MeshBuilder.CreateGround("grid", { width: 20, height: 20, subdivisions: 20 }, scene);
        grid.material = new BABYLON.StandardMaterial("gridMaterial", scene);
        grid.material.wireframe = true;

        var objects = [];

        function addObject(type) {
            let newObj;
            switch (type) {
                case "box":
                    newObj = BABYLON.MeshBuilder.CreateBox("box", { size: 2 }, scene);
                    break;
                case "sphere":
                    newObj = BABYLON.MeshBuilder.CreateSphere("sphere", { diameter: 2 }, scene);
                    break;
                case "cylinder":
                    newObj = BABYLON.MeshBuilder.CreateCylinder("cylinder", { diameter: 2, height: 3 }, scene);
                    break;
            }
            newObj.position.y = 1;
            objects.push(newObj);
            updateLayerControls();
        }

        function updateLayerControls() {
            const layerControls = document.getElementById("layerControls");
            layerControls.innerHTML = "";

            objects.forEach((obj, index) => {
                const layerDiv = document.createElement("div");
                layerDiv.classList.add("layer-control");
                layerDiv.innerHTML = `
                    <span>${obj.name}</span>
                    <div>
                        <button class="btn btn-sm btn-info" onclick="toggleVisibility(${index})">👁️</button>
                        <button class="btn btn-sm btn-warning" onclick="lockObject(${index})">🔒</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteObject(${index})">🗑️</button>
                    </div>
                `;
                layerControls.appendChild(layerDiv);
            });
        }

        function toggleVisibility(index) {
            objects[index].isVisible = !objects[index].isVisible;
        }

        function lockObject(index) {
            objects[index].isPickable = !objects[index].isPickable;
        }

        function deleteObject(index) {
            objects[index].dispose();
            objects.splice(index, 1);
            updateLayerControls();
        }

        document.getElementById("addBox").addEventListener("click", () => addObject("box"));
        document.getElementById("addSphere").addEventListener("click", () => addObject("sphere"));
        document.getElementById("addCylinder").addEventListener("click", () => addObject("cylinder"));

        document.getElementById("applyMaterial").addEventListener("click", () => {
            const color = document.getElementById("colorPicker").value;
            if (objects.length > 0) {
                const material = new BABYLON.StandardMaterial("material", scene);
                material.diffuseColor = BABYLON.Color3.FromHexString(color);
                objects[objects.length - 1].material = material;
            }
        });

        document.getElementById("exportModel").addEventListener("click", () => {
            const exporter = BABYLON.OBJExport.OBJ(scene);
            const blob = new Blob([exporter], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "model.obj";
            a.click();
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>

</body>
</html>
