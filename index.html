<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boda 💍 - Sube tus Fotos</title>
  <link rel="stylesheet" href="pau.css">
</head>
<body>
  <div class="container">
    <h1>💖 Nuestra Boda 💖</h1>
    <p>Sube aquí tus fotos y videos para compartir los recuerdos más bellos ✨</p>

    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    <button id="uploadBtn" onclick="uploadFiles()">Subir recuerdos</button>

    <!-- Loader en forma de corazón -->
    <div id="loader">
      <div class="heart"></div>
    </div>

    <pre id="response"></pre>
  </div>

  <script src="pau.js"></script>
</body>
</html>
