<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boda - Subida de Recuerdos</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #fdfcfb, #e2d1c3);
      color: #333;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    header {
      margin-bottom: 20px;
    }
    #clock {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }
    input[type="file"] {
      margin: 10px 0;
      width: 100%;
    }
    button {
      background: #c59d5f;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #a67c3d;
    }
    #upload-status {
      margin-top: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Comparte tus recuerdos</h1>
    <div id="clock"></div>
  </header>

  <form id="upload-form">
    <p>Selecciona tus fotos o videos y súbelos:</p>
    <input type="file" id="file-input" multiple accept="image/*,video/*">
    <button type="submit">Subir</button>
    <div id="upload-status"></div>
  </form>

  <script>
    // 🔹 CONFIGURACIÓN DE HORARIOS
    const timeSlots = [
      { start: "14:00", end: "14:30", folderId: "1Hss8TEjwjOy3maKPGZFrfNZoBa67sTtS" },
      { start: "14:31", end: "15:00", folderId: "1TSWvxT2563qumcmWTsyZ5j8jeHfYVRcb" },
      { start: "15:01", end: "16:00", folderId: "1aN6PIGGEaxzT2zxc1zCRGslXO8HtAPWK" }
    ];

    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbywP4vTj8rsULw2fD2iIoeDxSi1yCSSMbz3SBzYwyrHoBG2N9Eqm9qUSYFL47OHkgL-/exec";
    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50 MB

    // ⏰ Reloj España
    function updateClock() {
      const options = {
        timeZone: "Europe/Madrid",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      };
      const now = new Date();
      document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("es-ES", options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ⏰ Obtener carpeta según hora
    function getCurrentFolderId() {
      const now = new Date();
      const madridTime = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Madrid" }));
      const current = madridTime.getHours() * 60 + madridTime.getMinutes();

      for (let slot of timeSlots) {
        const [sh, sm] = slot.start.split(":").map(Number);
        const [eh, em] = slot.end.split(":").map(Number);
        const startMinutes = sh * 60 + sm;
        const endMinutes = eh * 60 + em;
        if (current >= startMinutes && current <= endMinutes) {
          return slot.folderId;
        }
      }
      return null;
    }

    // 📤 Subida automática
    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const files = document.getElementById("file-input").files;
      if (!files.length) {
        document.getElementById("upload-status").textContent = "Selecciona al menos un archivo.";
        return;
      }

      // Chequeo de tamaños
      for (let file of files) {
        if (file.size > MAX_FILE_SIZE) {
          document.getElementById("upload-status").textContent =
            `El archivo ${file.name} supera los 50MB y no se puede subir.`;
          return;
        }
      }

      const folderId = getCurrentFolderId();
      if (!folderId) {
        document.getElementById("upload-status").textContent =
          "No hay una carpeta definida para esta hora.";
        return;
      }

      const formData = new FormData();
      for (let file of files) {
        formData.append("files", file);
      }
      formData.append("folderId", folderId);

      document.getElementById("upload-status").textContent = "Subiendo...";

      try {
        const res = await fetch(UPLOAD_URL, {
          method: "POST",
          body: formData
        });
        const text = await res.text();
        document.getElementById("upload-status").textContent = "✅ " + text;
      } catch (err) {
        document.getElementById("upload-status").textContent = "❌ Error al subir.";
      }
    });

    // 🚀 Forzar que al abrir la página en móvil se abra el selector de archivos
    window.onload = () => {
      document.getElementById("file-input").click();
    };
  </script>

</body>
</html>
