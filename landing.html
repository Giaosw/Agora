<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boda 💍 - Landing</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #fff5f7);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a2c2c;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffffcc;
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .container:hover { transform: translateY(-5px); }

    h1 {
      font-size: 2.2rem;
      color: #d6336c;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
      color: #6a3a3a;
    }

    #qrcode {
      margin: 30px auto;
      width: 220px;
      height: 220px;
      padding: 10px;
      background: #fff7fb;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
      position: relative;
    }

    a {
      color: #d6336c;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #e83e8c;
      text-decoration: underline;
    }

    .small-text {
      font-size: 0.9rem;
      color: #4a2c2c;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💖 Nuestra Boda 💖</h1>
    <p>¡Escanea el QR y sube tus fotos y videos para compartir los recuerdos más bellos ✨!</p>

    <div id="qrcode"></div>

    <p class="small-text">O visita directamente: <a href="index.html" target="_blank">Sube tus recuerdos aquí</a></p>
  </div>

  <!-- Librería QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const qrURL = "https://giaosw.github.io/Agora/index.html"; // URL de la página de recuerdos

    // Generar QR normal
    new QRCode(document.getElementById("qrcode"), {
      text: qrURL,
      width: 220,
      height: 220,
      colorDark: "#d6336c",
      colorLight: "#fff7fb",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
